<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>會計學全功能筆記系統 (雲端同步版)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; background: #f8f9fa; color: #333; position: relative; }
    
    #sidebarOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 190; display: none; }
    #sidebarOverlay.show { display: block; }

    #sidebar { width: 290px; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 200; transition: transform 0.25s ease; flex-shrink: 0; height: 100vh; }
    .sidebar-header { padding: 14px 16px; font-weight: bold; font-size: 1rem; border-bottom: 1px solid #eee; background: #fcfcfc; color: #111; display: flex; justify-content: space-between; align-items: center; }
    .add-btn-group { padding: 8px 10px; display: flex; gap: 6px; border-bottom: 1px solid #eee; }
    
    .btn-action { flex: 1; padding: 8px 10px; font-size: 0.8rem; background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; text-align: center; }
    .btn-action:hover { background: #0056b3; }
    
    .chapter-list { overflow-y: auto; flex: 1; padding: 8px; }
    .chap-box { margin-bottom: 8px; }
    .chap-header { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 0.88rem; color: #222; padding: 8px 10px; background: #e9ecef; border-radius: 6px; }
    .sec-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin: 4px 0 2px 10px; background: #fff; border: 1px solid #e0e0e0; }
    .sec-item.active { background: #007aff; color: white; font-weight: 600; border-color: #007aff; }

    .ctrl-btns { display: flex; gap: 2px; align-items: center; }
    .micro-btn { background: none; border: none; font-size: 0.75rem; color: #666; cursor: pointer; padding: 2px 6px; border-radius: 3px; }
    .micro-btn:hover { background: rgba(0,0,0,0.1); color: #000; }

    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; overflow: hidden; background: #fff; position: relative; }
    .sticky-header-container { width: 100%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); z-index: 100; flex-shrink: 0; }

    .top-bar { padding: 8px 12px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; background: #fafafa; gap: 8px; }
    .top-bar-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .menu-toggle { display: none; font-size: 1.2rem; background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; }
    .doc-title { font-size: 0.92rem; font-weight: 700; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .sync-status { font-size: 0.75rem; color: #007aff; font-weight: bold; margin-right: 8px; }

    .lock-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; background: #e9ecef; border: 1px solid #ced4da; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none; flex-shrink: 0; }
    .lock-btn.is-read { background: #fff3bf; border-color: #fcc419; color: #856404; }

    .toolbar { display: flex; gap: 8px; padding: 8px 12px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; align-items: center; overflow-x: auto; white-space: nowrap; }
    .toolbar::-webkit-scrollbar { display: none; }
    
    .tool-btn { padding: 6px 10px; background: #fff; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .tool-btn:hover { background: #e9ecef; }
    .tool-btn.btn-primary { background: #007aff; color: white; border-color: #007aff; font-weight: 600; }
    .tool-btn.btn-hl { background: #fff9db; border-color: #fcc419; color: #856404; font-weight: 600; }

    .color-group { display: inline-flex; align-items: center; gap: 6px; padding-right: 4px; flex-shrink: 0; }
    .color-btn { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; flex-shrink: 0; }
    .color-black { background: #000000; }
    .color-red { background: #e63946; }
    .color-blue { background: rgb(29, 93, 221); }

    .editor-wrapper { flex: 1; padding: 20px; overflow-y: auto; position: relative; height: 100%; }
    #noteViewer { min-height: 100%; font-size: 0.98rem; line-height: 1.8; color: #2b2b2b; outline: none; padding-bottom: 250px; position: relative; z-index: 1; }

    .tree-box { position: absolute; min-width: 120px; min-height: 50px; background: #fff; border: 2px solid #007aff; border-radius: 8px; font-size: 0.85rem; z-index: 10; box-shadow: 0 3px 8px rgba(0,0,0,0.12); touch-action: none; resize: both; overflow: auto; display: inline-block; }
    .box-drag-handle { background: #f0f4f8; height: 18px; cursor: move; border-top-left-radius: 6px; border-top-right-radius: 6px; border-bottom: 1px solid #e0e0e0; }
    .box-quick-del { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; background: #ff3b30; color: white; border-radius: 50%; font-size: 13px; font-weight: bold; line-height: 22px; text-align: center; cursor: pointer; z-index: 30; border: 1.5px solid #fff; }
    .box-content { padding: 6px 10px; outline: none; cursor: text; min-height: 30px; }

    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      #sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div class="sidebar-header">
      <span>📚 會計學全功能筆記</span>
      <button class="micro-btn" style="font-size:1rem;" onclick="closeSidebar()">✕</button>
    </div>
    <div class="add-btn-group">
      <button class="btn-action" onclick="addNewChapter()">➕ 新增章節</button>
      <button class="btn-action" onclick="addNewSection()">➕ 新增小節</button>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </div>

  <div id="main">
    <div class="sticky-header-container">
      <div class="top-bar">
        <div class="top-bar-left">
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <div class="doc-title" id="currentTitle">筆記</div>
        </div>
        
        <span class="sync-status" id="syncStatus">⏳ 連線至 Firebase...</span>

        <button class="lock-btn" id="lockToggleBtn" onclick="toggleReadMode()">
          <span id="lockIcon">🔓</span>
          <span id="lockText">編輯模式</span>
        </button>
      </div>

      <div class="toolbar">
        <div class="color-group">
          <div class="color-btn color-black" title="黑色" onmousedown="event.preventDefault(); applyTextColor('#000000');"></div>
          <div class="color-btn color-red" title="紅色" onmousedown="event.preventDefault(); applyTextColor('#e63946');"></div>
          <div class="color-btn color-blue" title="藍色" onmousedown="event.preventDefault(); applyTextColor('rgb(29, 93, 221)');"></div>
        </div>

        <button class="tool-btn" style="font-weight:900;" onmousedown="event.preventDefault(); toggleBold();">B 粗體</button>
        <button class="tool-btn btn-hl" onmousedown="event.preventDefault(); applyHighlight('#ffec99');">🖍️ 螢光筆</button>
        <button class="tool-btn" onmousedown="event.preventDefault(); removeHighlight();">🧹 清除</button>
        <button class="tool-btn btn-primary" onclick="addFreeBox()">🔳 新增文字框</button>
        <button class="tool-btn" onclick="exportData()">📥 匯出備份</button>
        <button class="tool-btn" onclick="importData()">📤 載入備份</button>
        <input type="file" id="importInput" style="display:none;" onchange="handleFileSelect(event)">
      </div>
    </div>

    <div class="editor-wrapper" id="canvasWrapper">
      <div id="noteViewer" contenteditable="true" oninput="debouncedSave()"></div>
    </div>
  </div>

  <!-- Firebase 模組化載入 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBk5qBqzA7WCePRVRNn_8oRiWDLfKnV8Hc",
      authDomain: "olaf-accounting.firebaseapp.com",
      projectId: "olaf-accounting",
      storageBucket: "olaf-accounting.firebasestorage.app",
      messagingSenderId: "839216246057",
      appId: "1:839216246057:web:4a94ae9424c5b3d85c5b38",
      measurementId: "G-M8KFEMXSW5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.getDoc = getDoc;
    window.setDoc = setDoc;

    // 啟動資料庫
    initFirebaseData();
  </script>

  <script>
    let chapters = [
      { title: "會計基礎", sections: [{ id: "sec_1", title: "會計方程式", content: "會計基本恆等式：資產 = 負債 + 權益" }] }
    ];
    let currentSecId = "sec_1";
    let saveTimeout = null;
    let isCloudLoaded = false;

    async function initFirebaseData() {
      const syncStatus = document.getElementById("syncStatus");
      
      // 等待 Firebase 變數準備好
      let checks = 0;
      while (!window.db && checks < 20) {
        await new Promise(r => setTimeout(r, 200));
        checks++;
      }

      if (!window.db) {
        syncStatus.innerText = "⚠️ 本地模式";
        syncStatus.style.color = "#dc3545";
        loadSec(currentSecId);
        return;
      }

      try {
        const docRef = window.doc(window.db, "notes", "my_accounting_notes");
        const docSnap = await window.getDoc(docRef);

        if (docSnap.exists()) {
          chapters = docSnap.data().chapters;
        } else {
          // 第一次建立雲端檔案
          await window.setDoc(docRef, { chapters });
        }
        
        isCloudLoaded = true;
        syncStatus.innerText = "☁️ 已與雲端同步";
        syncStatus.style.color = "#28a745";

      } catch (e) {
        console.error("雲端讀取失敗:", e);
        syncStatus.innerText = "❌ 雲端同步失敗";
        syncStatus.style.color = "#dc3545";
      }

      renderSidebar();
      loadSec(currentSecId);
    }

    function debouncedSave() {
      if (!isCloudLoaded) return; // 沒讀取完之前不儲存，避免蓋掉雲端資料
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => { saveData(); }, 600);
    }

    async function saveData() {
      let sec = getSecObj(currentSecId);
      if (sec) sec.content = document.getElementById("noteViewer").innerHTML;

      if (window.db && isCloudLoaded) {
        const syncStatus = document.getElementById("syncStatus");
        syncStatus.innerText = "⏳ 儲存中...";
        syncStatus.style.color = "#007aff";
        try {
          await window.setDoc(window.doc(window.db, "notes", "my_accounting_notes"), { chapters });
          syncStatus.innerText = "☁️ 已儲存至雲端";
          syncStatus.style.color = "#28a745";
        } catch (e) {
          syncStatus.innerText = "❌ 儲存失敗";
          syncStatus.style.color = "#dc3545";
        }
      }
    }

    function renderSidebar() {
      const list = document.getElementById("chapterList");
      list.innerHTML = "";
      chapters.forEach((chap, cIdx) => {
        const cBox = document.createElement("div");
        cBox.className = "chap-box";
        cBox.innerHTML = `<div class="chap-header"><span>${chap.title}</span></div>`;

        chap.sections.forEach((sec) => {
          const item = document.createElement("div");
          item.className = `sec-item ${sec.id === currentSecId ? 'active' : ''}`;
          item.onclick = () => { switchSec(sec.id); closeSidebar(); };
          item.innerHTML = `<span>${sec.title}</span>`;
          cBox.appendChild(item);
        });
        list.appendChild(cBox);
      });
    }

    function switchSec(id) {
      // 切換前先把舊頁面儲存
      let sec = getSecObj(currentSecId);
      if (sec) sec.content = document.getElementById("noteViewer").innerHTML;
      
      currentSecId = id;
      loadSec(id);
      saveData();
    }

    function loadSec(id) {
      let sec = getSecObj(id);
      if (sec) {
        document.getElementById("noteViewer").innerHTML = sec.content || "";
        refreshCurrentTitle();
      }
      renderSidebar();
    }

    function getSecObj(id) {
      for (let c of chapters) {
        for (let s of c.sections) if (s.id === id) return s;
      }
      return null;
    }

    function refreshCurrentTitle() {
      chapters.forEach((c) => {
        c.sections.forEach((s) => {
          if (s.id === currentSecId) {
            document.getElementById("currentTitle").innerText = `${c.title} - ${s.title}`;
          }
        });
      });
    }

    function addNewChapter() {
      const name = prompt("請輸入新章節名稱：");
      if (name) {
        const newSecId = "sec_" + Date.now();
        chapters.push({
          title: name,
          sections: [{ id: newSecId, title: "小節 1", content: "請輸入筆記內容..." }]
        });
        switchSec(newSecId);
      }
    }

    function addNewSection() {
      if (chapters.length === 0) return alert("請先建立章節！");
      const name = prompt("請輸入新小節名稱：");
      if (name) {
        const newSecId = "sec_" + Date.now();
        chapters[0].sections.push({ id: newSecId, title: name, content: "請輸入筆記內容..." });
        switchSec(newSecId);
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    }

    function applyHighlight(bgColor) {
      document.execCommand('hiliteColor', false, bgColor);
      debouncedSave();
    }

    function removeHighlight() {
      document.execCommand('removeFormat', false, null);
      debouncedSave();
    }

    function applyTextColor(color) {
      document.execCommand('foreColor', false, color);
      debouncedSave();
    }

    function toggleBold() {
      document.execCommand('bold', false, null);
      debouncedSave();
    }

    function addFreeBox() {
      const wrapper = document.getElementById('canvasWrapper');
      const boxId = "box_" + Date.now();
      const box = document.createElement('div');
      box.className = 'tree-box';
      box.id = boxId;
      box.style.left = '60px';
      box.style.top = (100 + wrapper.scrollTop) + 'px';

      box.innerHTML = `
        <div class="box-quick-del" onclick="removeTreeBox('${boxId}')">✕</div>
        <div class="box-drag-handle"></div>
        <div class="box-content" contenteditable="true">輸入內容...</div>
      `;
      wrapper.appendChild(box);
      debouncedSave();
    }

    function removeTreeBox(boxId) {
      const box = document.getElementById(boxId);
      if (box) box.remove();
      debouncedSave();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chapters));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `accounting_notes_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      document.getElementById('importInput').click();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            chapters = imported;
            saveData();
            renderSidebar();
            alert("備份資料載入成功！");
          }
        } catch(err) {
          alert("檔案格式不正確！");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
